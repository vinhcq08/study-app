<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today · Study App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/today.css">
</head>
<body>
  <nav class="topnav" aria-label="Main">
    <a class="brand" href="./">Study App</a>
    <a class="navlink" data-nav="today" href="./"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Today</a>
    <a class="navlink" data-nav="tree" href="tree.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="6" r="2"></circle><circle cx="5" cy="18" r="2"></circle><circle cx="19" cy="12" r="2"></circle><path d="M7 6h4l4 6M7 18h4l4-6"></path></svg>Skill tree</a>
    <a class="navlink" data-nav="subject" href="subjects.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 19V5"></path></svg>Subjects</a>
    <span class="sp"></span>
    <button class="theme-toggle" id="themeToggle" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"></path></svg><span>Auto</span></button>
  </nav>

  <main class="wrap today">
    <header class="t-head">
      <div class="t-title">
        <span class="t-date" id="tDate"></span>
        <h1 id="tTitle">Today</h1>
        <p class="lede" id="tSub">Loading your plan…</p>
      </div>
      <div class="t-right">
        <div id="tStreak"></div>
        <label class="budget">Time today <select id="budget"></select></label>
      </div>
    </header>

    <div class="t-cols">
      <section class="t-plan" aria-label="Today's plan">
        <div id="upNext"></div>
        <h3 id="thenHead">Then</h3>
        <ul class="plan" id="plan"></ul>
        <div class="plan-tools" id="planTools"></div>
        <h3 id="doneHead">Done today</h3>
        <ul class="plan done" id="done"></ul>
      </section>

      <aside class="t-side">
        <section class="card"><div class="card-head"><h2>Exams</h2></div><div id="exams"></div></section>
        <section class="card"><div class="card-head"><h2>This week</h2><span class="none" id="weekTotal"></span></div><div id="week"></div></section>
        <section class="card"><div class="card-head"><h2>Your subjects</h2><a href="tree.html">Skill tree</a></div><div id="subjects"></div></section>
        <section class="card"><div class="card-head"><h2>Needs attention</h2></div><div id="weak"></div></section>
      </aside>
    </div>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="js/today.js"></script>
</body>
</html>
