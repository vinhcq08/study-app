<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Tree · Study App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <nav class="topnav" aria-label="Main">
    <a class="brand" href="./">Study App</a>
    <a class="navlink" data-nav="today" href="./"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Today</a>
    <a class="navlink" data-nav="tree" href="tree.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="6" r="2"></circle><circle cx="5" cy="18" r="2"></circle><circle cx="19" cy="12" r="2"></circle><path d="M7 6h4l4 6M7 18h4l4-6"></path></svg>Skill tree</a>
    <a class="navlink" data-nav="subject" href="subject.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 19V5"></path></svg>Subjects</a>
    <span class="sp"></span>
    <button class="theme-toggle" id="themeToggle" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"></path></svg><span>Auto</span></button>
  </nav>

  <main class="wrap">
    <header>
      <h1>Skill Tree</h1>
      <p class="lede">Your 43 degree subjects and 7 MIT gap-fillers, arranged by prerequisite. Mark subjects as you take them and watch the next ones unlock.</p>
      <div class="stats" id="stats"></div>
    </header>

    <div class="app">
      <div class="treecol">
        <div class="toolbar">
          <label class="search">
            <span class="sr-only">Find a subject</span>
            <input id="search" type="search" placeholder="Find a subject or MIT number" autocomplete="off">
          </label>
          <button class="btn" id="tGaps" aria-pressed="true">MIT gap-fillers</button>
          <button class="btn" id="tAI" aria-pressed="false">Path to AI</button>
          <span class="sp"></span>
          <div class="zoom" role="group" aria-label="Zoom">
            <button class="btn" id="zOut" aria-label="Zoom out">−</button>
            <button class="btn" id="zFit">Fit</button>
            <button class="btn" id="zIn" aria-label="Zoom in">+</button>
          </div>
        </div>
        <div class="viewport" id="viewport">
          <div class="sizer" id="sizer"><div class="canvas" id="canvas"></div></div>
        </div>
        <p class="hint">Tiers show prerequisite depth, not semesters. Press Esc to clear a selection.</p>
      </div>
      <aside class="panel" id="panel" aria-live="polite"><p class="none">Loading your tree…</p></aside>
    </div>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="js/skilltree.js"></script>
</body>
</html>
