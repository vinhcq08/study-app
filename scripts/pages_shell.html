<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study App</title>
  <!-- The GitHub Pages site's front page. It starts Python (Pyodide) once and shows the app's
       pages in a frame below, so moving between pages doesn't start Python again.
       The address bar follows the page in the frame: #subject.html?id=linalg and so on. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/editorial.css">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    #page { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  </style>
</head>
<body>
  <iframe id="page" title="Study App"></iframe>
  <script type="module">
    import { boot, call } from "./js/browser-backend.js";

    if (window.top !== window) location.replace("today.html");   // never nest the shell
    window.studyBackend = { call };
    boot().catch(() => {});   // start Python while the first page loads

    const PAGE = /^(today|tree|subject|subjects)\.html([?#].*)?$/;
    const frame = document.getElementById("page");
    const wanted = () => (PAGE.test(location.hash.slice(1)) ? location.hash.slice(1) : "today.html");
    let current = "";

    frame.addEventListener("load", () => {
      let win;
      try { win = frame.contentWindow; void win.location.href; } catch { return; }
      const update = () => {
        current = win.location.pathname.split("/").pop() + win.location.search + win.location.hash;
        history.replaceState(null, "", current === "today.html" ? location.pathname : `#${current}`);
        document.title = win.document.title;
      };
      update();
      win.addEventListener("hashchange", update);
      const title = win.document.querySelector("title");
      if (title) new MutationObserver(() => { document.title = win.document.title; })
        .observe(title, { childList: true, characterData: true, subtree: true });
    });
    window.addEventListener("hashchange", () => {
      const page = wanted();
      if (page !== current) frame.contentWindow.location.replace(page);
    });
    frame.src = wanted();
  </script>
</body>
</html>
